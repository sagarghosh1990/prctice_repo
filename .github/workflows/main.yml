name: etl_pipeline job

on:
  push:
    branches:
      - main

jobs:
    extract_data_job:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v2  
        - name: execute extract_data.py
          run: python extract_data.py  
    tranform_data_job:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v2
        - name: execute transform_data.py
          run: python transform_data.py
    load_data_job:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v2
        - name: execute load_data.py
          run: python load_data.py